<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Por Mi Carreta · Validador</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root{--paper:#f7f3ea;--ink:#111;--ok:#14853c;--bad:#bd241e;--muted:#dedede}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    .wrap{max-width:680px;margin:0 auto;padding:18px}
    h1{font-size:28px;margin:6px 0 18px}
    .gate{display:flex;gap:10px;margin-bottom:14px}
    .gate button,.scan,.manual button{border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:800}
    .gate button{flex:1;background:var(--muted)}
    .gate button.active{background:#fff;outline:4px solid #222}
    .scan{width:100%;background:#111;color:#fff;margin:8px 0 14px}
    #reader{background:#fff;border-radius:14px;overflow:hidden}
    .result{display:none;margin-top:12px;padding:18px;border-radius:16px;text-align:center}
    .result.ok{display:block;background:#e8f6ec;border:3px solid var(--ok)}
    .result.bad{display:block;background:#fdebea;border:3px solid var(--bad)}
    .result h2{font-size:31px;margin:0 0 6px}
    .ticket{font-size:28px;font-weight:900}
    .meta{font-size:15px;margin-top:7px;line-height:1.35}
    .manual{margin-top:16px;border-top:1px solid #bbb;padding-top:14px}
    .manual input,.pin input{width:100%;padding:12px;font-size:19px;border:2px solid #aaa;border-radius:10px}
    .manual input{text-transform:uppercase}
    .manual button{width:100%;background:#5d5d5d;color:#fff;margin-top:8px}
    .pin{margin-bottom:12px}
    .hint{font-size:12px;color:#555;margin-top:7px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>POR MI CARRETA · Validador</h1>

  <div class="pin">
    <strong>PIN de acceso:</strong>
    <input id="pin" inputmode="numeric" autocomplete="off" value="311026">
  </div>

  <div class="gate">
    <button id="gateA" class="active" onclick="setGate('PUERTA A')">PUERTA A</button>
    <button id="gateB" onclick="setGate('PUERTA B')">PUERTA B</button>
  </div>

  <button class="scan" onclick="startScanner()">ESCANEAR ENTRADA</button>
  <div id="reader"></div>

  <div id="result" class="result">
    <h2 id="statusText"></h2>
    <div id="ticketText" class="ticket"></div>
    <div id="metaText" class="meta"></div>
  </div>

  <div class="manual">
    <strong>Si el QR no se lee:</strong>
    <input id="manualInput" placeholder="Ej. PMC-0367">
    <button onclick="validateManual()">VALIDAR MANUALMENTE</button>
    <div class="hint">El número manual es solo para incidencias.</div>
  </div>
</div>

<script>
// CONSERVA aquí la MISMA URL /exec que ya tienes funcionando.
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbztb74K4Kc1cUSra7vL0-XJ_AAo6fbfzqH8kQKzj8SUUNdJ69phd7BToOLk20rWOBhaEw/exec';

let gate='PUERTA A';
let scanner=null;
let busy=false;
let pendingScript=null;
let timeoutId=null;
let lastDecoded='';
let lastDecodedAt=0;

function setGate(name){
  gate=name;
  document.getElementById('gateA').classList.toggle('active',name==='PUERTA A');
  document.getElementById('gateB').classList.toggle('active',name==='PUERTA B');
}

function startScanner(){
  if(scanner) return;
  const pin=document.getElementById('pin').value.trim();
  if(!pin){showLocalError('INTRODUCE EL PIN DE ACCESO');return;}

  scanner=new Html5Qrcode('reader');

  scanner.start(
    {facingMode:'environment'},
    {fps:18, qrbox:{width:260,height:260}, aspectRatio:1.0},
    decodedText=>{
      const now=Date.now();

      // Evita dobles lecturas del mismo QR por la cámara.
      if(decodedText===lastDecoded && now-lastDecodedAt<1800) return;
      if(busy) return;

      lastDecoded=decodedText;
      lastDecodedAt=now;
      busy=true;

      // Pausa solo mientras llega la respuesta central.
      try{scanner.pause(true)}catch(e){}
      validate(decodedText);
    },
    ()=>{}
  ).catch(()=>{
    showLocalError('NO SE HA PODIDO ABRIR LA CÁMARA');
    scanner=null;
  });
}

function validateManual(){
  const value=document.getElementById('manualInput').value.trim();
  if(!value||busy) return;
  busy=true;
  validate(value);
}

function validate(value){
  const pin=document.getElementById('pin').value.trim();
  if(!pin){finishWithError('INTRODUCE EL PIN DE ACCESO');return;}
  if(!BACKEND_URL.startsWith('https://script.google.com/')){
    finishWithError('FALTA CONFIGURAR LA URL DEL VALIDADOR');return;
  }

  cleanupRequest();

  const url=BACKEND_URL
    +'?mode=validate'
    +'&token='+encodeURIComponent(value)
    +'&gate='+encodeURIComponent(gate)
    +'&pin='+encodeURIComponent(pin)
    +'&callback=pmcValidationCallback'
    +'&t='+Date.now();

  pendingScript=document.createElement('script');
  pendingScript.src=url;
  pendingScript.async=true;
  pendingScript.onerror=()=>finishWithError('NO SE HA PODIDO CONECTAR CON LA BASE DE DATOS');
  document.body.appendChild(pendingScript);

  timeoutId=setTimeout(
    ()=>finishWithError('LA VALIDACIÓN HA TARDADO DEMASIADO'),
    7000
  );
}

window.pmcValidationCallback=function(res){
  cleanupRequest();
  showResult(res||{ok:false,status:'ERROR',message:'ERROR'});

  // Reanuda casi inmediatamente: la persona puede presentar el siguiente QR.
  setTimeout(resumeScanner,250);
};

function cleanupRequest(){
  if(timeoutId){clearTimeout(timeoutId);timeoutId=null}
  if(pendingScript){
    try{pendingScript.remove()}catch(e){}
    pendingScript=null;
  }
}

function resumeScanner(){
  busy=false;
  if(scanner){
    try{scanner.resume()}catch(e){}
  }
}

function finishWithError(text){
  cleanupRequest();
  showLocalError(text);
  setTimeout(resumeScanner,400);
}

function showResult(res){
  const box=document.getElementById('result');
  box.className='result '+(res.ok?'ok':'bad');

  let title=res.message||'ERROR';
  if(res.status==='VALIDA') title='✅ ENTRADA VÁLIDA';
  if(res.status==='USADA') title='❌ YA UTILIZADA';
  if(res.status==='INVALIDA') title='❌ NO VÁLIDA';
  if(res.status==='PIN') title='❌ PIN INCORRECTO';

  document.getElementById('statusText').textContent=title;
  document.getElementById('ticketText').textContent=res.ticket||'';

  let meta='';
  if(res.status==='VALIDA'){
    meta=`${res.gate||gate} · ${res.validatedAt||''}`;
  }else if(res.status==='USADA'){
    meta=`Validada: ${res.validatedAt||'sin hora'}${res.gate?' · '+res.gate:''}`;
  }
  document.getElementById('metaText').textContent=meta;
}

function showLocalError(text){
  showResult({ok:false,status:'ERROR',message:'❌ '+text});
}
</script>
</body>
</html>
